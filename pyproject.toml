#This file is used to package the SupplierCartPanel plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.20.0
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-supplier-panel"
description = "Syncronize a PO with a supplier online store"
dynamic = ["version"]
authors = [
    { name = "Michael Buchmann",email = "michael@buchmann.ruhr" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    # Enter your plugin library dependencies here
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]
[project.urls]
Homepage = "https://github.com/SergeoLacruz/inventree-supplier-panel"

[project.entry-points."inventree_plugins"]
SupplierCartPanel = "inventree_supplier_panel.supplier_panel:SupplierCartPanel"

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.dynamic]
version = {attr = "inventree_supplier_panel.version.PLUGIN_VERSION"}

[tool.setuptools.package-data]
inventree_supplier_panel = ["templates/**/*", "static/**/*"]

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["inventree_supplier_panel"]
